# Production deployment for a single VPS.
#
#   cp .env.example .env   # then fill in every value
#   docker compose up -d --build
#
# Caddy terminates HTTPS (Let's Encrypt, automatic) and is the only service
# exposed to the internet. Posta, the worker, Postgres and Redis stay on the
# private network.

# Settings shared by the server and the worker. The worker needs the same JWT
# secret (it signs tracking links) and the same encryption key (it decrypts the
# stored SMTP password at send time), so both read them from here.
x-posta-env: &posta-env
  POSTA_ENV: production
  POSTA_DB_HOST: posta-db
  POSTA_DB_PORT: "5432"
  POSTA_DB_NAME: posta
  POSTA_DB_USER: posta
  POSTA_DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
  POSTA_DB_SSL_MODE: disable
  POSTA_REDIS_ADDR: posta-redis:6379
  POSTA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
  POSTA_JWT_SECRET: ${POSTA_JWT_SECRET:?required, generate with openssl rand -hex 32}
  POSTA_ENCRYPTION_KEY: ${POSTA_ENCRYPTION_KEY:?required, generate with openssl rand -hex 32}
  POSTA_WEB_URL: https://${POSTA_DOMAIN:?required}
  POSTA_WORKER_MAX_RETRIES: "5"

x-posta-build: &posta-build
  context: ..
  dockerfile: docker/Dockerfile

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      POSTA_DOMAIN: ${POSTA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - posta
    networks: [posta]
    restart: unless-stopped

  posta:
    build: *posta-build
    image: posta:local
    command: ["server"]
    environment:
      <<: *posta-env
      POSTA_ADMIN_EMAIL: ${POSTA_ADMIN_EMAIL:?required}
      POSTA_ADMIN_PASSWORD: ${POSTA_ADMIN_PASSWORD:?required, min 12 chars}
      # Sending is done by the dedicated worker below.
      POSTA_EMBEDDED_WORKER: "false"
      # Only Caddy may set X-Forwarded-For; matches the subnet below.
      POSTA_TRUSTED_PROXIES: 172.28.0.0/16
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      posta-db:
        condition: service_healthy
      posta-redis:
        condition: service_healthy
    networks: [posta]
    restart: unless-stopped

  worker:
    image: posta:local
    command: ["worker"]
    environment:
      <<: *posta-env
      POSTA_WORKER_CONCURRENCY: "10"
    depends_on:
      posta:
        condition: service_healthy
    networks: [posta]
    restart: unless-stopped

  posta-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: posta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: posta
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posta"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [posta]
    restart: unless-stopped

  posta-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [posta]
    restart: unless-stopped

networks:
  posta:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
